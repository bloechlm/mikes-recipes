<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#191e18"><title>Mike’s Recipes</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--ink:#faf5e8;--dim:#c7c5b7;--glass:#ffffff0b;--line:#fff2;--leaf:#d8e6ab;--serif:'Playfair Display',Georgia,serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 86% 20%,#363e29,transparent 58%),#191e18;color:var(--ink);font:16px 'DM Sans',system-ui,sans-serif;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--leaf);outline-offset:3px}button{color:inherit}header{border-bottom:1px solid var(--line);background:#20261cb8;backdrop-filter:blur(20px);position:sticky;top:0;z-index:2}.wrap{max-width:1320px;margin:auto;padding-inline:clamp(18px,5vw,70px)}nav{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:78px}.brand{font:500 clamp(20px,3vw,26px) var(--serif);display:flex;align-items:center;gap:12px}.seal{width:37px;height:37px;border:1px solid #d8e6ab66;border-radius:50%;display:grid;place-items:center;color:var(--leaf);font:italic 20px var(--serif)}.btn,.chip{border:1px solid var(--line);border-radius:100px;background:#ffffff0c;padding:10px 17px;font-weight:600;backdrop-filter:blur(16px)}.btn:hover,.chip:hover{background:#ffffff20}.primary,.chip[aria-pressed=true]{background:var(--leaf);border-color:transparent;color:#202719}.primary:hover{background:#ecf3cd}main{padding-top:32px;padding-bottom:72px}.hero{position:relative;isolation:isolate;min-height:420px;display:flex;align-items:center;padding:clamp(25px,6vw,78px);overflow:hidden;border:1px solid var(--line);border-radius:32px;background:#2c2f20;box-shadow:0 24px 80px #0004}.hero img,.hero:after{position:absolute;inset:0;width:100%;height:100%;z-index:-1}.hero img{object-fit:cover;object-position:70% 54%}.hero:after{content:'';background:linear-gradient(90deg,#161910f7 0%,#171a12d9 28%,#171a1260 60%,#171a1210 100%)}.hero-copy{max-width:560px}.eyebrow{letter-spacing:.18em;text-transform:uppercase;font-size:13px;font-weight:700;color:var(--leaf)}h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0}h1{font-size:clamp(45px,7vw,87px);line-height:1.04;margin:14px 0 18px;letter-spacing:-.05em}h1 em{color:var(--leaf);font-weight:500}.hero p{color:#e2dfd0;max-width:360px;line-height:1.6;margin:0 0 24px}.collection{margin-top:42px}.heading{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap}.heading h2{font-size:clamp(31px,5vw,48px);letter-spacing:-.04em}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.search{max-width:100%;width:260px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{padding:0;text-align:left;border:1px solid var(--line);background:linear-gradient(150deg,#ffffff14,#ffffff06);box-shadow:inset 0 1px #ffffff18,0 12px 30px #0003;border-radius:24px;overflow:hidden;transition:transform .2s,background .2s}.card:hover{transform:translateY(-4px);background:#ffffff18}.card img,.placeholder{display:block;width:100%;aspect-ratio:1.65;object-fit:cover;background:radial-gradient(circle at 75% 30%,#657048,#232a20)}.card div.copy{padding:18px}.card h3{margin:5px 0 9px;font-size:25px}.muted{color:var(--dim)}.card .eyebrow{font-size:12px}.empty{grid-column:1/-1;color:var(--dim);padding:20px 0}dialog{border:1px solid #ffffff36;border-radius:26px;background:#22291ff5;color:var(--ink);width:min(720px,calc(100% - 24px));max-height:90dvh;padding:0;box-shadow:0 24px 100px #0009}dialog::backdrop{background:#10150ebf;backdrop-filter:blur(10px)}.panel{padding:clamp(19px,4vw,36px)}.dialog-head,.portion,.actions,.line-item{display:flex;align-items:center;justify-content:space-between;gap:10px}.dialog-head{margin-bottom:20px}.dialog-head h2{font-size:clamp(27px,5vw,40px)}.icon{min-width:42px;padding:8px}.detail-image{width:100%;height:clamp(150px,27vw,260px);object-fit:cover;display:block}.portion{border:1px solid var(--line);background:var(--glass);padding:12px 14px;border-radius:16px;margin:15px 0 20px}.stepper{display:flex;align-items:center;gap:9px}.stepper input{width:68px;text-align:center}.ingredients{list-style:none;padding:0;margin:0 0 24px}.ingredients li{padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:14px}.ingredients strong{white-space:nowrap;color:var(--leaf)}.instructions{line-height:1.65;padding-left:22px}.instructions li{padding:4px 0;white-space:pre-wrap}form label{display:grid;gap:7px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}input,textarea,select{min-width:0;background:#11170f99;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}textarea{resize:vertical;min-height:110px}.rows{display:grid;gap:8px;margin:10px 0}.line-item{display:grid;grid-template-columns:minmax(0,1fr) 82px 95px 42px}.actions{justify-content:flex-end;flex-wrap:wrap;margin-top:22px}.danger{color:#ffc1ab}.error{color:#ffc1ab;min-height:1em}.photo-field{margin:14px 0}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:540px){nav{min-height:66px}.hero{border-radius:24px;min-height:380px}.grid{grid-template-columns:1fr}.line-item{grid-template-columns:minmax(0,1fr) 61px 67px 42px;gap:5px}.line-item input{padding:9px 6px}.wrap{padding-inline:16px}.heading{align-items:stretch}.search{width:100%}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body>
<header><nav class="wrap"><div class="brand"><span class="seal" aria-hidden="true">M</span>Mike’s Recipes</div><button class="btn primary" id="new" type="button">＋ Rezept anlegen</button></nav></header>
<main class="wrap"><section class="hero"><img id="hero-image" alt="" fetchpriority="high"><div class="hero-copy"><span class="eyebrow">Ricette di casa</span><h1>Meine Küche,<br><em>meine Rezepte.</em></h1><p>Ein Kochbuch für deine Lieblingsgerichte. Koch für dich, für zwei oder für die ganze Runde.</p><button class="btn" id="browse" type="button">Rezepte entdecken</button></div></section>
<section class="collection" id="collection" aria-labelledby="collection-title"><div class="heading"><h2 id="collection-title">Rezeptsammlung</h2><input class="search" id="search" type="search" placeholder="Rezept suchen …" aria-label="Rezept suchen"></div><div class="filters" id="filters" aria-label="Nach Kategorie filtern"></div><div class="grid" id="grid"></div></section></main>
<dialog id="detail" aria-labelledby="detail-title"></dialog>
<dialog id="editor" aria-labelledby="editor-title"><form class="panel" id="form"><div class="dialog-head"><h2 id="editor-title">Rezept anlegen</h2><button class="btn icon" type="button" data-close="editor" aria-label="Schließen">×</button></div>
<label>Rezeptname<input name="title" required maxlength="100"></label>
<div class="fields"><label>Kategorie<select name="category"><option>Pizza</option><option>Pasta</option><option>Vorspeise</option><option>Dessert</option><option>Sonstiges</option></select></label><label>Grundportionen<input name="servings" type="number" min="1" max="999" required value="2"></label></div>
<label class="photo-field">Bild-URL (optional)<input name="image" type="url" placeholder="https://…"></label>
<h3>Zutaten</h3><div class="rows" id="rows"></div><button class="btn" id="add-row" type="button">＋ Zutat hinzufügen</button>
<label class="photo-field">Zubereitung<textarea name="steps" placeholder="Ein Schritt pro Zeile"></textarea></label>
<p class="error" id="error" role="alert"></p><div class="actions"><button class="btn" type="button" data-close="editor">Abbrechen</button><button class="btn primary" type="submit">Rezept speichern</button></div></form></dialog>
<script>
const photo=(id,width=1000)=>'https://images.unsplash.com/'+id+'?auto=format&fit=crop&w='+width+'&q=84';
const pizza=photo('photo-1574071318508-1cdbab80d002');
const samples=[
 {id:'pizza',title:'Pizza Napoletana',category:'Pizza',servings:4,image:pizza,ingredients:[['Pizzamehl Tipo 00',640,'g'],['Wasser',416,'ml'],['Salz',18,'g'],['Frische Hefe',1,'g'],['Passierte Tomaten',280,'g'],['Fior di latte',320,'g'],['Basilikum',12,'Blätter']],steps:['Mehl, Wasser, Hefe und Salz zu einem glatten Teig kneten. Abgedeckt reifen lassen.','In vier Teiglinge teilen und vor dem Backen auf Raumtemperatur kommen lassen.','Mit den Händen formen, mit Tomaten und Fior di latte belegen und im stark vorgeheizten Ofen auf einem Pizzastein oder Backstahl backen. Mit Basilikum servieren.']},
 {id:'pasta',title:'Spaghetti al Pomodoro',category:'Pasta',servings:2,image:photo('photo-1551183053-bf91a1d81141'),ingredients:[['Spaghetti',200,'g'],['Geschälte Tomaten',400,'g'],['Olivenöl',2,'EL'],['Knoblauch',1,'Zehe'],['Basilikum',null,'nach Geschmack']],steps:['Knoblauch im Olivenöl sanft anschwitzen. Tomaten dazugeben, zerdrücken und etwa 20 Minuten köcheln.','Spaghetti al dente kochen. Mit etwas Kochwasser in der Sauce schwenken und mit Basilikum servieren.']},
 {id:'salad',title:'Insalata mit Tomaten',category:'Vorspeise',servings:2,image:photo('photo-1512621776951-a57141f2eefd'),ingredients:[['Cherrytomaten',150,'g'],['Blattsalat',100,'g'],['Gurke',0.5,'Stk.'],['Olivenöl',2,'EL'],['Zitronensaft',1,'EL']],steps:['Gemüse waschen und klein schneiden.','Olivenöl und Zitronensaft verrühren, abschmecken und mit dem Salat mischen.']}
];
const $=id=>document.getElementById(id);
const key='mikes-recipes-v1';
const categories=['Alle','Pizza','Pasta','Vorspeise','Dessert','Sonstiges'];
const numbers=new Intl.NumberFormat('de-AT',{maximumSignificantDigits:5});
function readRecipes(){try{const data=JSON.parse(localStorage.getItem(key));if(Array.isArray(data))return data;}catch{}return samples;}
let recipes=readRecipes(),category='Alle',editing=null;
function save(next){localStorage.setItem(key,JSON.stringify(next));recipes=next;render();}
function el(tag,cls,value){const node=document.createElement(tag);if(cls)node.className=cls;if(value!==undefined)node.textContent=value;return node;}
function action(label,cls,fn){const b=el('button',cls,label);b.type='button';b.onclick=fn;return b;}
function imageFor(url,cls){if(!url)return el('div',cls||'placeholder');const img=el('img',cls);img.src=url;img.alt='';img.onerror=()=>img.replaceWith(el('div',cls||'placeholder'));return img;}
$('hero-image').src=photo('photo-1574071318508-1cdbab80d002',1800);
$('browse').onclick=()=>$('collection').scrollIntoView({block:'start'});
$('new').onclick=()=>openEditor();
$('search').oninput=render;
function render(){
 $('filters').replaceChildren(...categories.map(name=>{const b=action(name,'chip',()=>{category=name;render();[...$('filters').children].find(item=>item.textContent===name)?.focus();});b.setAttribute('aria-pressed',name===category);return b;}));
 const query=$('search').value.trim().toLocaleLowerCase('de');
 const shown=recipes.filter(r=>(category==='Alle'||r.category===category)&&[r.title,...r.ingredients.map(row=>row[0])].some(value=>value.toLocaleLowerCase('de').includes(query)));
 $('grid').replaceChildren(...shown.map(r=>{const b=action('','card',()=>openDetail(r));const copy=el('div','copy');copy.append(el('span','eyebrow',r.category),el('h3','',r.title),el('span','muted',r.servings+(r.servings===1?' Portion':' Portionen')));const img=imageFor(r.image);if(img.tagName==='IMG')img.loading='lazy';b.append(img,copy);return b;}));
 if(!shown.length)$('grid').append(el('p','empty','Keine Rezepte gefunden.'));
}
function openDetail(r){
 const dialog=$('detail'),panel=el('div','panel'),head=el('div','dialog-head'),title=el('h2','',r.title),close=action('×','btn icon',()=>dialog.close());
 title.id='detail-title';close.setAttribute('aria-label','Schließen');head.append(title,close);
 const portions=el('div','portion'),label=el('label','','Portionen'),stepper=el('div','stepper'),input=el('input'),list=el('ul','ingredients');
 input.id='portions';input.type='number';input.min=1;input.max=999;input.step=1;input.value=r.servings;label.htmlFor=input.id;
 function refresh(){const n=input.valueAsNumber;if(!Number.isInteger(n)||n<1||n>999)return;list.replaceChildren(...r.ingredients.map(([name,qty,unit])=>{const li=el('li');li.append(el('span','',name),el('strong','',qty==null?unit:[numbers.format(qty*n/r.servings),unit].filter(Boolean).join(' ')));return li;}));}
 function step(by){input.value=Math.max(1,Math.min(999,(input.valueAsNumber||r.servings)+by));refresh();}
 const minus=action('−','btn icon',()=>step(-1)),plus=action('+','btn icon',()=>step(1));minus.setAttribute('aria-label','Eine Portion weniger');plus.setAttribute('aria-label','Eine Portion mehr');
 input.oninput=refresh;input.onchange=()=>{if(!input.checkValidity()||!input.value)input.value=r.servings;refresh();};
 stepper.append(minus,input,plus);portions.append(label,stepper);list.setAttribute('aria-live','polite');refresh();
 panel.append(head,portions,el('h3','','Zutaten'),list);
 if(r.steps.length){const steps=el('ol','instructions');steps.append(...r.steps.map(s=>el('li','',s)));panel.append(el('h3','','Zubereitung'),steps);}
 const actions=el('div','actions');const error=el('p','error');error.setAttribute('role','alert');actions.append(action('Löschen','btn danger',()=>{if(!confirm('Rezept „'+r.title+'“ löschen?'))return;try{save(recipes.filter(item=>item.id!==r.id));dialog.close();}catch{error.textContent='Das Rezept konnte nicht gelöscht werden.';}}),action('Bearbeiten','btn',()=>{dialog.close();openEditor(r);}));panel.append(error,actions);
 dialog.replaceChildren(...(r.image?[imageFor(r.image,'detail-image'),panel]:[panel]));dialog.showModal();
}
function row(values=['','','']){
 const wrapper=el('div','line-item'),name=el('input'),amount=el('input'),unit=el('input');
 name.placeholder='Zutat';name.setAttribute('aria-label','Zutat');name.maxLength=100;
 amount.placeholder='Menge';amount.setAttribute('aria-label','Menge');amount.inputMode='decimal';amount.pattern='[0-9]+([.,][0-9]+)?';
 unit.placeholder='Einheit';unit.setAttribute('aria-label','Einheit');unit.maxLength=50;
 [name,amount,unit].forEach((input,index)=>input.value=values[index]??'');
 const remove=action('×','btn icon',()=>{wrapper.remove();if(!$('rows').children.length)row();});remove.setAttribute('aria-label','Zutat entfernen');
 wrapper.append(name,amount,unit,remove);$('rows').append(wrapper);return name;
}
const form=$('form');
function openEditor(r){
 editing=r?.id??null;form.reset();$('error').textContent='';$('rows').replaceChildren();$('editor-title').textContent=r?'Rezept bearbeiten':'Rezept anlegen';
 if(r){for(const name of ['title','category','image','servings'])form.elements[name].value=r[name];form.elements.steps.value=r.steps.join('\n');}
 (r?.ingredients.length?r.ingredients:[[]]).forEach(row);$('editor').showModal();form.elements.title.focus();
}
$('add-row').onclick=()=>row().focus();
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).close());
form.onsubmit=event=>{
 event.preventDefault();const inputs=new FormData(form),title=inputs.get('title').trim(),image=inputs.get('image').trim(),ingredients=[];
 $('error').textContent='';
 if(!title){$('error').textContent='Bitte gib deinem Rezept einen Namen.';return;}
 if(image&&!/^https?:\/\//i.test(image)){$('error').textContent='Bitte verwende eine Bild-URL mit https:// oder http://.';return;}
 for(const item of $('rows').children){
  const [name,amount,unit]=[...item.querySelectorAll('input')].map(input=>input.value.trim());
  if(!name&&(amount||unit)){$('error').textContent='Bitte gib jeder Zutatenzeile einen Namen.';return;}
  if(name){const qty=amount?Number(amount.replace(',','.')):null;if(qty!==null&&!Number.isFinite(qty)){$('error').textContent='Bitte überprüfe die Zutatenmenge.';return;}ingredients.push([name,qty,unit]);}
 }
 if(!ingredients.length){$('error').textContent='Bitte füge mindestens eine Zutat hinzu.';return;}
 const id=editing??(globalThis.crypto?.randomUUID?.()??String(Date.now()));
 const recipe={id,title,image,ingredients,category:inputs.get('category'),servings:Number(inputs.get('servings')),steps:inputs.get('steps').split('\n').map(s=>s.trim()).filter(Boolean)};
 try{save(editing?recipes.map(r=>r.id===id?recipe:r):[recipe,...recipes]);}catch{$('error').textContent='Der Browser konnte das Rezept nicht speichern.';return;}
 $('editor').close();openDetail(recipe);
};
render();
</script></body></html>
